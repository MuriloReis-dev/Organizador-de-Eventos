<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizador de Eventos</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1f2430;--muted:#6b7280;--line:#d9dce3;--accent:#4f46e5;--stage:#fff;--grid:#e8eaf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--panel:#1d2029;--text:#e8eaf0;--muted:#9aa1b0;--line:#323746;--accent:#818cf8;--stage:#1a1d25;--grid:#262a35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--panel:#1d2029;--text:#e8eaf0;--muted:#9aa1b0;--line:#323746;--accent:#818cf8;--stage:#1a1d25;--grid:#262a35;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:1.05rem;margin:0 12px 0 0}
button,input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.danger{color:#dc2626}
main{flex:1;display:flex;gap:14px;padding:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#wrap{flex:1 1 640px;max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
#stage{position:relative;width:900px;height:560px;background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:2px solid var(--muted);border-radius:6px;touch-action:none;user-select:none}
.it{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;font-weight:600;color:#111;padding:4px;border:2px solid rgba(0,0,0,.35);cursor:move;overflow:hidden;line-height:1.15;word-break:break-word}
.it.circle{border-radius:50%}
.it.text{background:transparent!important;border:2px dashed transparent;color:var(--text);font-size:1rem}
.it.sel{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--accent) 50%)}
aside{flex:0 0 230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
aside h2{font-size:.95rem;margin:0}
label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=color]{padding:2px;height:36px;width:100%}
.row{display:flex;gap:8px}.row button{flex:1}
.hint{font-size:.78rem;color:var(--muted);margin:0}
#count{font-size:.85rem;color:var(--muted)}
.pal{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pal button{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:.85rem}
.pal i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.35);display:inline-block}
.pal .sep{width:1px;background:var(--line);margin:0 4px}
.gate{position:absolute;top:240px;height:80px;width:2px;pointer-events:none;z-index:0}
.gate.in{left:-2px;background:var(--stage)}.gate.out{right:-2px;background:var(--stage)}
.gate span{position:absolute;top:0;height:80px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:0 3px;border-radius:4px}
.gate.in span{left:4px;background:#16a34a;color:#fff}.gate.out span{right:4px;background:#dc2626;color:#fff}
.gate.in::after,.gate.out::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--stage);border-top:2px solid var(--muted);border-bottom:2px solid var(--muted)}
.gate.in::after{left:-2px}.gate.out::after{right:-2px}
</style>
</head>
<body>
<header>
  <h1>🎪 Organizador de Eventos</h1>
  <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="snap" checked> Alinhar à grade</label>
  <span style="flex:1"></span>
  <span id="count"></span>
  <button id="clear" class="danger">Limpar tudo</button>
</header>
<div class="pal" id="pal"></div>
<main>
  <div id="wrap"><div id="stage"></div></div>
  <aside>
    <h2>Item selecionado</h2>
    <div id="none" class="hint">Adicione uma forma e clique nela para editar. Arraste para mover, use o canto para redimensionar.</div>
    <div id="form" hidden style="display:none;flex-direction:column;gap:10px">
      <label>Função / nome
        <input id="label" list="sug" placeholder="Ex.: Palco, Bar, Banheiro">
        <datalist id="sug"><option>Palco</option><option>Pista de dança</option><option>Bar</option><option>Mesas</option><option>Entrada</option><option>Banheiros</option><option>Cozinha</option><option>Camarim</option><option>Estacionamento</option></datalist>
      </label>
      <label>Cor <input type="color" id="color"></label>
      <div class="row"><button id="dup">Duplicar</button><button id="del" class="danger">Excluir</button></div>
    </div>
    <p class="hint">Tudo é salvo automaticamente neste navegador.</p>
  </aside>
</main>
<script>
const stage=document.getElementById('stage'),$=id=>document.getElementById(id);
let items=[],sel=null,seq=1;
const KEY='evento-layout-v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){items=s;seq=Math.max(0,...items.map(i=>i.id))+1}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const snap=v=>$('snap').checked?Math.round(v/20)*20:v;
const defaults={rect:{w:140,h:100,color:'#fbbf24',label:'Área'},circle:{w:120,h:120,color:'#6ee7b7',label:'Mesa'},text:{w:160,h:40,color:'#ffffff',label:'Texto'}};

function render(){
  stage.innerHTML='<div class="gate in"><span>ENTRADA ▶</span></div><div class="gate out"><span>◀ SAÍDA</span></div>';
  items.forEach(it=>{
    const d=document.createElement('div');
    d.className='it '+it.type+(it.id===sel?' sel':'');
    Object.assign(d.style,{left:it.x+'px',top:it.y+'px',width:it.w+'px',height:it.h+'px',background:it.color});
    d.textContent=it.label;
    d.onpointerdown=e=>startDrag(e,it,'move');
    d.ondblclick=()=>{$('label').focus();$('label').select()};
    if(it.id===sel){const r=document.createElement('div');r.className='rs';r.onpointerdown=e=>{e.stopPropagation();startDrag(e,it,'size')};d.appendChild(r)}
    stage.appendChild(d);
  });
  const cur=items.find(i=>i.id===sel);
  $('none').style.display=cur?'none':'block';
  $('form').style.display=cur?'flex':'none';
  if(cur){if(document.activeElement!==$('label'))$('label').value=cur.label;$('color').value=cur.color}
  $('count').textContent=items.length+' item(ns)';
}
function startDrag(e,it,mode){
  e.preventDefault();e.stopPropagation();
  sel=it.id;
  const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y,ow=it.w,oh=it.h;
  render();
  const mv=ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(mode==='move'){it.x=Math.max(0,Math.min(900-it.w,snap(ox+dx)));it.y=Math.max(0,Math.min(560-it.h,snap(oy+dy)))}
    else{it.w=Math.max(40,Math.min(900-it.x,snap(ow+dx)));it.h=Math.max(30,Math.min(560-it.y,snap(oh+dy)))}
    const el=stage.children[items.indexOf(it)+2];
    el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.width=it.w+'px';el.style.height=it.h+'px';
  };
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);save()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function add(type,src){
  const d=defaults[type];
  const it=Object.assign({id:seq++,type,x:snap(380),y:snap(240)},d,src||{});
  items.push(it);sel=it.id;save();render();
}
const presets=[
 ['🥟 Barraca de pastel','rect','#fcd34d',140,90],
 ['🍔 Lanches','rect','#fdba74',140,90],
 ['🍲 Comida típica','rect','#fca5a5',140,90],
 ['🥤 Bebidas','rect','#7dd3fc',120,90],
 ['🍰 Doces','rect','#f9a8d4',120,90],
 ['🚻 Banheiros','rect','#c4b5fd',100,100],
 ['🪑 Mesas','circle','#6ee7b7',100,100],
 ['🎤 Palco','rect','#a5b4fc',200,100],
 ['💳 Caixa','rect','#fde68a',80,60],
 ['🗑️ Lixo','rect','#d1d5db',60,60],
 ['▭ Retângulo','rect','#e5e7eb',140,100],
 ['◯ Círculo','circle','#e5e7eb',120,120],
 ['T Texto','text','#ffffff',160,40]];
presets.forEach(([label,type,color,w,h],i)=>{
  if(i===10){const s=document.createElement('div');s.className='sep';$('pal').appendChild(s)}
  const b=document.createElement('button');
  b.innerHTML=(type==='text'?'':'<i style="background:'+color+'"></i>')+label;
  b.onclick=()=>add(type,{label:type==='text'?'Texto':label,color,w,h});
  $('pal').appendChild(b);
});
stage.onpointerdown=()=>{sel=null;render()};
$('label').oninput=e=>{const c=items.find(i=>i.id===sel);if(c){c.label=e.target.value;save();render()}};
$('color').oninput=e=>{const c=items.find(i=>i.id===sel);if(c){c.color=e.target.value;save();render()}};
$('del').onclick=()=>{items=items.filter(i=>i.id!==sel);sel=null;save();render()};
$('dup').onclick=()=>{const c=items.find(i=>i.id===sel);if(c)add(c.type,{...c,id:undefined,x:Math.min(900-c.w,c.x+20),y:Math.min(560-c.h,c.y+20)})};
$('clear').onclick=()=>{if(items.length&&confirm('Remover todos os itens?')){items=[];sel=null;save();render()}};
addEventListener('keydown',e=>{if(e.key==='Delete'&&sel&&document.activeElement.tagName!=='INPUT')$('del').click()});
render();
</script>
</body>
</html>
